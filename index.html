<!doctype html>

<head>

<style>
:root {
 --site-primary:#173F35; --site-secondary:#DDEBE3; --site-background:#F4F6F3;
 --site-on-primary:#FFFFFF; --site-on-secondary:#183D31; --site-on-background:#1D2B25;
 --site-font-body:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
 --site-font-heading:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
 --site-heading-scale:1; --site-spacing-scale:1; --site-radius-scale:1; --site-decoration-opacity:1;
 color-scheme:light dark;
}
*{box-sizing:border-box}body{margin:0;font-family:var(--site-font-body);background:light-dark(#F4F6F3,#141A17);color:light-dark(#1D2B25,#E8EEE9)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{background-color:var(--site-background);color:var(--site-on-background);min-height:100vh;display:flex}.sidebar{width:248px;background:var(--site-primary);color:var(--site-on-primary);padding:25px 15px;display:flex;flex-direction:column;gap:22px;flex-shrink:0}.brand{display:flex;align-items:center;gap:11px;padding:0 10px}.brandmark{width:37px;height:37px;border-radius:calc(12px * var(--site-radius-scale));background:#D7E8DA;color:#173F35;display:grid;place-items:center;font-weight:900}.brand h1{font-size:calc(17px * var(--site-heading-scale));margin:0}.brand small{display:block;opacity:.72;font-size:11px;margin-top:3px}.navlabel{padding:0 12px;text-transform:uppercase;letter-spacing:1.2px;font-size:10px;opacity:.58;font-weight:800}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:inherit;text-align:left;padding:12px;border-radius:calc(10px * var(--site-radius-scale));display:flex;align-items:center;gap:11px;font-size:13px}.nav button:hover,.nav button.active{background:#FFFFFF20}.nav .ico{width:20px;text-align:center;font-size:16px}.sidefoot{margin-top:auto;background:#FFFFFF12;padding:14px;border-radius:calc(12px * var(--site-radius-scale));font-size:12px;line-height:1.5}.sidefoot strong{display:block;margin-bottom:4px}.main{flex:1;min-width:0}.topbar{height:72px;border-bottom:1px solid light-dark(#DDE4DE,#303B34);display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:light-dark(#FFFFFF,#1B221E)}.crumb{font-size:12px;color:light-dark(#758179,#A8B5AC)}.topright{display:flex;align-items:center;gap:14px;font-size:12px}.avatar{width:33px;height:33px;display:grid;place-items:center;background:var(--site-secondary);color:var(--site-on-secondary);border-radius:50%;font-weight:800}.content{padding:30px 32px 44px;max-width:1600px;margin:auto}.headingrow{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;color:#668172;font-weight:800;font-size:10px;margin-bottom:8px}.headingrow h2{font-size:calc(28px * var(--site-heading-scale));letter-spacing:-.8px;margin:0 0 7px}.sub{color:light-dark(#748078,#A9B3AC);font-size:13px}.btn{border:1px solid light-dark(#D6DFD8,#39453D);background:light-dark(#FFFFFF,#202923);color:inherit;padding:10px 14px;border-radius:calc(9px * var(--site-radius-scale));font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:7px}.btn.primary{background:var(--site-primary);color:var(--site-on-primary);border-color:var(--site-primary)}.btn.soft{background:var(--site-secondary);color:var(--site-on-secondary);border-color:transparent}.btn.danger{color:#B84C43}.btn:disabled{opacity:.45;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}.stat{background:light-dark(#FFFFFF,#1C241F);border:1px solid light-dark(#E0E6E1,#303B34);border-radius:calc(14px * var(--site-radius-scale));padding:18px}.stathead{display:flex;justify-content:space-between;align-items:center;color:light-dark(#718078,#A8B4AB);font-size:12px}.staticon{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--site-secondary);color:var(--site-on-secondary)}.statnum{font-size:28px;font-weight:800;letter-spacing:-1px;margin:13px 0 4px}.statnote{font-size:11px;color:light-dark(#849087,#9CA99F)}.panel{background:light-dark(#FFFFFF,#1C241F);border:1px solid light-dark(#E0E6E1,#303B34);border-radius:calc(14px * var(--site-radius-scale));margin-bottom:20px;overflow:hidden}.panelhead{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid light-dark(#E8ECE9,#303B34);gap:12px}.panelhead h3{font-size:14px;margin:0}.panelhead p{font-size:11px;color:light-dark(#7B877F,#A4B0A7);margin:5px 0 0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}th{text-align:left;background:light-dark(#F8FAF8,#202923);color:light-dark(#77837B,#AAB5AC);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.65px;padding:13px 18px}td{padding:14px 18px;border-top:1px solid light-dark(#EDF0ED,#2A342D)}.productname{font-weight:750}.muted{font-size:11px;color:light-dark(#879188,#A0ACA3);margin-top:4px}.pill{display:inline-flex;padding:5px 8px;border-radius:30px;font-size:10px;font-weight:800;align-items:center;gap:5px}.pill.green{background:#DDF3E4;color:#23683D}.pill.yellow{background:#FFF0CD;color:#8B6411}.pill.red{background:#FBE1DE;color:#A63E37}.pill.blue{background:#DDEBFC;color:#285A94}.pill.gray{background:#E9EDEA;color:#59665E}.search{position:relative;min-width:220px}.search input{width:100%;padding:10px 12px 10px 34px;border:1px solid light-dark(#DCE3DD,#3A463D);border-radius:9px;background:light-dark(#FFFFFF,#202923);color:inherit;font-size:12px}.search span{position:absolute;left:12px;top:9px;color:#849087}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.two-col{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(270px,1fr);gap:18px}.empty{padding:35px;text-align:center;color:#879188;font-size:12px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:20px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:800;color:light-dark(#59685E,#BBC5BD)}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid light-dark(#DCE3DD,#3A463D);border-radius:8px;background:light-dark(#FFFFFF,#202923);color:inherit;font-size:12px}.field textarea{min-height:75px;resize:vertical}.formactions{display:flex;justify-content:flex-end;gap:9px;padding:0 20px 20px}.note{font-size:11px;line-height:1.6;color:light-dark(#78857C,#A8B3AA);padding:0 20px 17px}.section{display:none}.section.active{display:block}.lotlist{display:grid;gap:10px;padding:16px}.lot{border:1px solid light-dark(#E2E8E3,#354037);border-radius:10px;padding:13px;display:grid;grid-template-columns:1fr auto;gap:7px}.lot strong{font-size:12px}.lot .meta{font-size:11px;color:#829087;line-height:1.7}.lot .qty{font-weight:800;font-size:18px;text-align:right}.lot .qty small{display:block;font-size:10px;font-weight:500;color:#839087}.notice{background:light-dark(#EDF5EF,#23352A);border:1px solid light-dark(#D9E8DC,#35503C);border-radius:10px;padding:13px 15px;font-size:12px;line-height:1.6;margin-bottom:18px}.toggleline{display:flex;align-items:center;gap:9px;font-size:12px}.toggleline input{accent-color:#173F35}.mobilemenu{display:none}.toast{position:fixed;right:22px;bottom:22px;background:#173F35;color:white;padding:13px 18px;border-radius:10px;box-shadow:0 10px 35px #0002;font-size:12px;z-index:5;display:none}.smallbtn{border:0;background:transparent;color:#6A7C70;padding:4px;font-size:15px}.scanrow{display:flex;gap:8px}.scanrow input{flex:1;min-width:0}
@media(prefers-color-scheme:dark){.app{--site-background:#141A17;--site-on-background:#E8EEE9}.sidebar{background:#102E25}.staticon{background:#294337;color:#DAEADF}.btn.soft{background:#294337;color:#DAEADF}.notice{background:#203329}.pill.gray{background:#343E37;color:#DAE2DB}}
@media(max-width:1050px){.sidebar{width:215px}.content{padding:24px 20px}.topbar{padding:0 20px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}}
</style>

<body>

<div class="app">
  <!-- Menú Lateral -->
  <div class="sidebar">
    <div class="brand">
      <div class="brandmark">📦</div>
      <div>
        <h1>Control Empaques</h1>
        <small>v2.0 Sincronizado</small>
      </div>
    </div>
    <div style="height:10px"></div>
    <span class="navlabel">Módulos</span>
    <div class="nav">
      <button class="active" onclick="switchTab('catalog')"><span class="ico">📁</span> Catálogo</button>
      <button onclick="switchTab('stock')"><span class="ico">📊</span> Niveles Stock</button>
      <button onclick="switchTab('moves')"><span class="ico">🔄</span> Movimientos</button>

    <div class="sidefoot">
      <strong>Estado de Red:</strong>
      <span id="network-status" class="pill green">Conectado a la Nube</span>

  <!-- Contenedor Principal -->
  <div class="main">
    <div class="topbar">
      <div class="crumb" id="current-crumb">Catálogo de Empaques</div>

        <div class="avatar">U</div>
      </div>
    </div>

    <div class="content">
      <!-- MÓDULO CATÁLOGO -->
      <div id="sec-catalog" class="section active">
        <div class="headingrow">
          <div>
            <div class="eyebrow">Administración</div>
            <h2>Catálogo Central</h2>
            <div class="sub">Registra y edita tipos de empaque oficiales.</div>
          </div>
